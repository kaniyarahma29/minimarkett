<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f5f5f5; }

        header {
            background: #ff6b00;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .running-text { background: #ff8533; padding: 5px; margin-top: 10px; border-radius: 5px; }

        .judul { text-align: center; margin: 20px 0; }

        .produk-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .card h3 { margin: 10px 0; text-transform: capitalize; }
        .card p { color: #ff6b00; font-weight: bold; margin-bottom: 10px; }
        .card button {
            background: #ff6b00; color: white; border: none;
            padding: 8px 15px; border-radius: 5px; cursor: pointer;
        }
        .card button:hover { background: #e55f00; }

        /* KERANJANG */
        .keranjang {
            position: fixed;
            top: 0; right: -400px;
            width: 350px; height: 100%;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.2);
            transition: 0.3s;
            padding: 20px;
            z-index: 999;
        }
        .keranjang.active { right: 0; }
        .keranjang h2 { margin-bottom: 15px; border-bottom: 2px solid #ff6b00; padding-bottom: 10px; }
        
        .item-keranjang {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px;
        }
        .item-keranjang button { background: red; padding: 3px 8px; font-size: 12px; }

        .total { font-weight: bold; font-size: 18px; margin-top: 15px; }
        .btn-checkout { 
            width: 100%; background: #28a745; color: white; border: none; 
            padding: 10px; border-radius: 5px; margin-top: 10px; cursor: pointer;
        }

        #btnKeranjang {
            position: fixed; top: 20px; right: 20px;
            background: #ff6b00; color: white; border: none;
            padding: 10px 15px; border-radius: 50px; cursor: pointer;
            z-index: 1000;
        }
        #jumlahItem { background: red; border-radius: 50%; padding: 2px 6px; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <h1>🛒 MINIMARKET</h1>
    <marquee class="running-text">
    SELAMAT DATANG DI MINIMARKET
    </marquee>
</header>

<button id="btnKeranjang">Keranjang 🛍️ <span id="jumlahItem">0</span></button>

<h2 class="judul">DAFTAR PRODUK</h2>

<div class="produk-container">
    <div class="card" data-nama="olala jelly drink" data-harga="2000">
        <img src="jelly.jpg" alt="olala jelly drink">
        <h3>OLALA JELLY DRINK</h3>
        <p>Rp2.000</p>
        <button onclick="tambahKeKeranjang(this)">Tambah</button>
    </div>

    <div class="card" data-nama="susu coklat" data-harga="4000">
        <img src="susu.jpg" alt="susu coklat">
        <h3>SUSU COKLAT</h3>
        <p>Rp4.000</p>
        <button onclick="tambahKeKeranjang(this)">Tambah</button>
    </div>

    <div class="card" data-nama="malkist" data-harga="3000">
        <img src="mlks.jpg" alt="malkist">
        <h3>MALKIST</h3>
        <p>Rp3.000</p>
        <button onclick="tambahKeKeranjang(this)">Tambah</button>
    </div>

    <div class="card" data-nama="nabati" data-harga="2500">
        <img src="nabati.jpg" alt="nabati">
        <h3>NABATI</h3>
        <p>Rp2.500</p>
        <button onclick="tambahKeKeranjang(this)">Tambah</button>
    </div>
</div>

<!-- KERANJANG BELANJA -->
<div class="keranjang" id="keranjang">
    <h2>Keranjang Belanja</h2>
    <div id="listKeranjang">
        <p>Keranjang kosong</p>
    </div>
    <div class="total">Total: Rp<span id="totalHarga">0</span></div>
    <button class="btn-checkout" onclick="checkout()">Checkout</button>
    <button class="btn-checkout" style="background: gray;" onclick="toggleKeranjang()">Tutup</button>
</div>

<script>
    let keranjang = [];

    function toggleKeranjang() {
        document.getElementById('keranjang').classList.toggle('active');
    }

    document.getElementById('btnKeranjang').onclick = toggleKeranjang;

    function tambahKeKeranjang(btn) {
        const card = btn.parentElement;
        const nama = card.dataset.nama;
        const harga = parseInt(card.dataset.harga);

        const item = keranjang.find(i => i.nama === nama);
        if (item) {
            item.jumlah += 1;
        } else {
            keranjang.push({ nama, harga, jumlah: 1 });
        }
        updateKeranjang();
    }

    function hapusItem(nama) {
        keranjang = keranjang.filter(i => i.nama !== nama);
        updateKeranjang();
    }

    function updateKeranjang() {
        const list = document.getElementById('listKeranjang');
        const totalEl = document.getElementById('totalHarga');
        const jumlahEl = document.getElementById('jumlahItem');

        if (keranjang.length === 0) {
            list.innerHTML = '<p>Keranjang kosong</p>';
        } else {
            list.innerHTML = keranjang.map(item => `
                <div class="item-keranjang">
                    <div>
                        <b>${item.nama}</b><br>
                        ${item.jumlah} x Rp${item.harga.toLocaleString('id-ID')}
                    </div>
                    <button onclick="hapusItem('${item.nama}')">X</button>
                </div>
            `).join('');
        }

        const total = keranjang.reduce((sum, item) => sum + item.harga * item.jumlah, 0);
        const jumlah = keranjang.reduce((sum, item) => sum + item.jumlah, 0);

        totalEl.textContent = total.toLocaleString('id-ID');
        jumlahEl.textContent = jumlah;
    }

    function checkout() {
        if (keranjang.length === 0) {
            alert('Keranjang masih kosong!');
            return;
        }
        alert('Checkout berhasil! Total: Rp' + document.getElementById('totalHarga').textContent);
        keranjang = [];
        updateKeranjang();
        toggleKeranjang();
    }
</script>

</body>
</html>
